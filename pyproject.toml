[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fused"
version = "1.0.0"
description = "FUSED: a forensic SparseViT branch and a frozen CLIP-ConvNeXt-XXL semantic branch fused by a sparse mixture of experts, with a joint segmentation and detection head for AI inpainting localization."
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Pinned to the environment used for the reported results.
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "timm==1.0.24",
    "huggingface-hub==1.21.0",
    "opencv-python-headless==4.11.0.86",
    "scikit-learn==1.7.2",
    "pyyaml==6.0.3",
    "pillow==12.1.0",
    "numpy==1.26.4",
    "tqdm==4.67.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "wandb==0.24.0",
    "matplotlib>=3.8,<4",   # figures only
    "albumentations>=1.3.0,<2",
]

[tool.setuptools.packages.find]
include = ["fused*"]
